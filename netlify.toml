# Конфигурация деплоя на Netlify.
# Netlify сам определяет Next.js и подключает рантайм, но фиксируем явно.

[build]
  # prisma generate — генерит клиент с нужным движком (см. schema.prisma),
  # затем обычная сборка Next. (npm run build = "prisma generate && next build")
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Ставим и devDependencies (нужны prisma, tsx во время сборки)
  NPM_FLAGS = "--legacy-peer-deps"

# Официальный рантайм Next.js для Netlify (SSR, API-роуты, middleware)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Подстраховка: кладём движок Prisma в бандл серверлес-функций
[functions]
  included_files = ["node_modules/.prisma/client/**"]
